user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access_log main;

    sendfile on;
    keepalive_timeout 65;

    upstream control_plane {
        server control-plane:8000;
    }

    upstream ai_engine {
        server ai-engine:8001;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 100M; # Support large document uploads

        # Shared configuration for WebSocket headers mapping
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ==========================================
        # AI ENGINE ROUTING (Server 2)
        # ==========================================

        # Programmatic stream API router
        location /api/v1/chat {
            proxy_pass http://ai_engine;
        }

        # WebSocket chat console router
        location /ws/ {
            proxy_pass http://ai_engine;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }


        # Widget embeds chatbot WebSocket router
        location /api/chatbots/ {
            proxy_pass http://ai_engine;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Documents uploads and vector RAG configuration
        location /api/documents {
            proxy_pass http://ai_engine;
        }

        # Third-party drive and OAuth connectors sync
        location /api/connectors {
            proxy_pass http://ai_engine;
        }

        # Workspace notifications broadcast
        location /api/notifications {
            proxy_pass http://ai_engine;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Meta Agent blueprint generators
        location /api/meta_agent {
            proxy_pass http://ai_engine;
        }

        # Audio APIs
        location /api/tts {
            proxy_pass http://ai_engine;
        }

        location /stt {
            proxy_pass http://ai_engine;
        }

        # ==========================================
        # CONTROL PLANE ROUTING (Server 1)
        # ==========================================

        location /api/auth {
            proxy_pass http://control_plane;
        }

        location /api/oauth {
            proxy_pass http://control_plane;
        }

        location /api/billing {
            proxy_pass http://control_plane;
        }

        location /api/workspaces {
            proxy_pass http://control_plane;
        }

        location /api/analytics {
            proxy_pass http://control_plane;
        }

        location /api/admin {
            proxy_pass http://control_plane;
        }

        location /api/settings {
            proxy_pass http://control_plane;
        }

        location /api/models {
            proxy_pass http://control_plane;
        }

        location /api/demo {
            proxy_pass http://control_plane;
        }

        location /api/chat_history {
            proxy_pass http://control_plane;
        }

        location /api/agents {
            proxy_pass http://control_plane;
        }

        location /api/workspace_tools {
            proxy_pass http://control_plane;
        }

        # Serving static files uploaded directly
        location /uploads {
            proxy_pass http://control_plane;
        }

        # Catch-all default fallback configuration
        location / {
            proxy_pass http://control_plane;
        }
    }
}
